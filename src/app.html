<!doctype html>
<html lang="%paraglide.lang%">
	<head>
		<title>yellowscan - The Yellow Network Explorer</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
		<meta name="author" content="yellowscan" />
		<meta
			name="description"
			content="Explore and monitor The Yellow Network's channels, app sessions, and assets. Real-time network statistics and comprehensive data analysis."
		/>
		<meta
			name="keywords"
			content="Yellow Network, explorer, channels, app sessions, cryptocurrency, DeFi, network scanner, assets, analytics"
		/>
		<meta name="format-detection" content="telephone=no" />
		<meta name="theme-color" content="#000000" />
		<meta name="robots" content="index, follow" />
		<meta
			name="googlebot"
			content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1"
		/>
		<meta name="application-name" content="yellowscan" />
		<meta name="rating" content="general" />
		<meta name="referrer" content="origin-when-cross-origin" />

		<!-- Preconnect for performance -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

		<!-- Additional favicon formats -->
		<link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="%sveltekit.assets%/favicon-16x16.png" />
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />

		<!-- Open Graph meta tags -->
		<meta property="og:title" content="yellowscan - The Yellow Network Explorer" />
		<meta
			property="og:description"
			content="Explore and monitor The Yellow Network's channels, app sessions, and network assets."
		/>
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="yellowscan" />
		<meta property="og:url" content="https://yellowscan.io" />
		<meta property="og:image" content="https://yellowscan.io/og-preview.jpg" />
		<meta property="og:image:alt" content="Visit yellowscan" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:locale" content="en_US" />

		<link rel="canonical" href="https://yellowscan.io" />

		<!-- Structured Data -->
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "WebSite",
				"name": "yellowscan - The Yellow Network Explorer",
				"description": "Explore and monitor The Yellow Network's channels, app sessions, and assets. Real-time network statistics and comprehensive data analysis.",
				"url": "https://yellowscan.io",
				"sameAs": [],
				"potentialAction": {
					"@type": "SearchAction",
					"target": "https://yellowscan.io/search?q={search_term_string}",
					"query-input": "required name=search_term_string"
				},
				"author": {
					"@type": "Organization",
					"name": "yellowscan"
				},
				"publisher": {
					"@type": "Organization",
					"name": "yellowscan"
				}
			}
		</script>

		<link rel="shortcut icon" href="%sveltekit.assets%/favicon.ico" />

		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
